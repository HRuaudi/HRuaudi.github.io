<style>
:root{
  /* drafting film + diazo ink + red pencil */
  --film:#E7EAE5; --sheet:#F6F7F3; --ink:#222C55; --ink-2:#586281; --hair:#C4CAD1; --red:#C0332A; --tree:#4F7361; --rock:#716A60;
  --f-let:"Barlow Semi Condensed","Gothic A1","Arial Narrow",sans-serif;
  --f-ko:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --gut:24px; --pad:40px; --tb:46px;
  --top:calc(env(safe-area-inset-top,0px) + var(--tb) + 12px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ /* CAD model space */
    --film:#11151A; --sheet:#1B2128; --ink:#DCE2EC; --ink-2:#97A3B6; --hair:#34404D; --red:#FF6F59; --tree:#7FA68C; --rock:#A8A092; color-scheme:dark; }
}
:root[data-theme="dark"]{ --film:#11151A; --sheet:#1B2128; --ink:#DCE2EC; --ink-2:#97A3B6; --hair:#34404D; --red:#FF6F59; --tree:#7FA68C; --rock:#A8A092; color-scheme:dark; }

*{box-sizing:border-box}
body{margin:0;background:var(--film);color:var(--ink);font:400 15px/1.7 var(--f-ko);word-break:keep-all;overflow-wrap:break-word;padding:0 var(--gut) 32px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
@media (hover:hover){ a:hover{color:var(--red)} }
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
h1,h2,h3,p,ol,ul,dl,dd{margin:0}
ol,ul{padding:0;list-style:none}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* deep links and keyboard focus stop just below the stuck tab bar. Set on the targets, not as a root scroll-padding:
   with a root padding Chrome re-scrolls the page every time a tab in the stuck bar gets keyboard focus */
.pg [id],.pg :is(a,button,input,[tabindex]){scroll-margin-top:var(--top)}

/* sheet frame with column ticks */
.frame{max-width:1200px;margin:16px auto 0;background:var(--sheet);border:1.5px solid var(--ink)}
.ticks{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));height:18px;font:500 10.5px/18px var(--f-let);color:var(--ink-2);text-align:center}
.ticks span{position:relative}
.ticks span+span::before{content:"";position:absolute;left:0;top:0;height:6px;border-left:1px solid var(--ink-2)}
.ticks.b span+span::before{top:auto;bottom:0}
/* on load, once: the frame's top rule is drawn left to right (a sheet-coloured cover over it shrinks away to the right; at rest
   its scale is 0, so it paints nothing) and the ticks come down one after another behind the pen */
.ticks{position:relative}
.ticks:not(.b)::before{content:"";position:absolute;left:0;right:0;bottom:100%;border-top:1.5px solid var(--sheet);transform:scaleX(0);transform-origin:right;animation:rule .6s ease-out .12s backwards}
@keyframes rule{from{transform:none}}
.ticks:not(.b) span+span::before{animation:tick .2s ease-out backwards;animation-delay:calc(var(--i) * 45ms + 180ms)} /* held undrawn a moment (WebKit paints its first frame late) */
@keyframes tick{from{height:0}}
.top{padding:16px var(--pad) 0}
/* panels + footer fill at least one screen under the tab bar, so the stuck bar never jumps when switching to a short panel
   (50px, just under the 51.5px of bottom ticks, frame border and page padding); the footer follows the content, spare room goes below it */
.panels{min-height:calc(100vh - var(--tb) - env(safe-area-inset-top,0px) - 50px)}
.pg{padding:24px var(--pad) 32px}
.ft{margin:0 var(--pad);padding:12px 0 14px;border-top:1px solid var(--hair);font-size:14px;line-height:1.6;color:var(--ink-2)}
.ft .contact{margin-top:8px}

.blk + .blk{margin-top:32px}
h2{font:600 20px/1.4 var(--f-ko);margin-bottom:12px}
@media (min-width:941px){ .blk + .blk{margin-top:48px} }
.h2row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-bottom:12px}
.h2row h2{margin:0}
.h2row p{font-size:14px;line-height:1.5;color:var(--ink-2)}

/* profile: text on the left, photo on the right, top edges aligned */
.pro{display:grid;grid-template-columns:minmax(0,1fr) 128px;column-gap:40px}
.pro-id,.thesis,.contact{grid-column:1}
/* Korean role, then its English on the same line when there is room (like the name line) */
.pro-id{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:14px}
.pro-id h1{flex-basis:100%}
.pro img{grid-column:2;grid-row:1/span 3;align-self:start;display:block;width:128px;height:auto;border:1px solid var(--ink)}
.pro h1{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;font:600 30px/1.2 var(--f-ko);letter-spacing:.02em}
.pro h1 span{font:500 14px var(--f-let);letter-spacing:.24em;color:var(--ink-2)}
.pro-role{font-size:16px;line-height:1.5;margin-top:8px}
.seg{display:inline-block}
.role-en{font:400 14px/1.45 var(--f-let);color:var(--ink-2)}
.thesis{font-size:16px;line-height:1.7;max-width:56em;margin-top:14px;text-wrap:pretty}
.contact{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.em:empty{display:none}
.em{font:500 18px var(--f-let);letter-spacing:.02em;margin-right:4px;user-select:all;-webkit-user-select:all}
.btn{font:500 13.5px/1 var(--f-let);letter-spacing:.04em;color:var(--ink);background:transparent;border:1px solid var(--ink);padding:7px 12px;cursor:pointer;border-radius:0;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px}
@media (hover:hover){ .btn:hover{background:var(--ink);color:var(--sheet)} }
.btn[aria-pressed="true"],.btn.done{background:var(--ink);color:var(--sheet)}
/* facts: quiet figures on the right of the tab bar's row. They belong to the header, not to the sticky bar:
   laid over the bar's row (negative bottom margin, drawn above it), they scroll away with the header.
   From the moment the bar sticks they are faded out (.off, set by the script), so the stuck bar shows only the tabs.
   Their box is only as wide as the figures, so it never covers a tab */
.facts{position:relative;z-index:21;display:flex;align-items:baseline;gap:0 20px;width:max-content;height:var(--tb);margin:12px 0 calc(-1 * var(--tb)) auto;padding-top:10.4px} /* puts the figures on the tab labels' baseline (measured) */
.facts.off{opacity:0;pointer-events:none}
.fact{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.fact b{font:500 17px/1.2 var(--f-let);font-variant-numeric:tabular-nums}
.fact span{font-size:14px;line-height:1.2;color:var(--ink-2)}

/* tab bar: sticks to the top once scrolled past */
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);padding:0 var(--pad);box-shadow:0 calc(-1 * env(safe-area-inset-top,0px)) 0 var(--sheet)}
.tabs{display:flex;gap:28px;height:var(--tb);margin-inline:-4px;overflow-x:auto;scrollbar-width:none;background:linear-gradient(var(--ink),var(--ink)) 4px 100%/calc(100% - 8px) 1px no-repeat}
.tabs::-webkit-scrollbar{display:none}
/* 4px side padding keeps the focus ring off the text; the label itself sits on the content's left edge */
.tabs a{position:relative;display:flex;align-items:center;gap:6px;flex:none;padding:0 4px;text-decoration:none;font:400 16px/1.2 var(--f-ko);color:var(--ink-2);white-space:nowrap}
.tabs a::after{content:"";position:absolute;left:4px;right:4px;bottom:0;height:3px}
.tabs a[aria-current="page"]::after{background:var(--ink)}
/* rings drawn inside, so the scroll box cannot clip them */
.tabs a:focus-visible,.ly:focus-visible{outline-offset:-2px}
/* the bold label's width is reserved, so the tabs never shift when the active one changes */
.tl{display:inline-flex;flex-direction:column}
.tl::after{content:attr(data-t);font-weight:600;height:0;overflow:hidden;visibility:hidden}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:600}
@media (hover:hover){ .tabs a:hover{color:var(--red)} }
.cap{font-size:14px;line-height:1.5;color:var(--ink-2);margin-bottom:12px}

/* 02 research */
.lede{max-width:56em}
.lede p+p{margin-top:12px}
.lt{display:block;color:var(--ink)}
.rl-box svg{display:block}
.rl-cap{display:flex;flex-wrap:wrap;gap:4px 24px;margin-top:8px;padding-top:8px;border-top:1px solid var(--hair);font-size:14px;color:var(--ink-2);line-height:1.5}
.rl-cap>span{display:inline-flex;align-items:center;gap:8px}
.rl-cap .red{color:var(--red)}
.dets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 48px}
.det{display:flex;flex-direction:column;gap:8px;min-width:0}
.det-draw svg{display:block;max-width:100%;height:auto}
.det-title{display:flex;gap:12px;align-items:center;margin-top:4px}
.dno{flex:none;width:30px;height:30px;border:1.3px solid var(--ink);border-radius:50%;display:grid;place-items:center;font:600 14px/1 var(--f-let)}
.det h3{font:600 17px/1.35 var(--f-ko)}
.det .meta{font:400 14px/1.4 var(--f-let);color:var(--ink-2)}
.det-q{color:var(--red);border-left:2px solid var(--red);padding-left:12px;font-size:14.5px;line-height:1.6;text-wrap:balance}
.det-sum{font-size:14.5px;line-height:1.7}
.det-kw{font:400 13.5px/1.5 var(--f-let);color:var(--ink-2)}
.det-go{align-self:flex-start;font-size:14px;text-decoration:none;border-bottom:1px solid var(--ink);line-height:1.5}
@media (hover:hover){ .det-go:hover{border-color:var(--red)} }

/* svg drawing classes */
svg .s-ink{stroke:var(--ink);fill:none}
svg .s-2{stroke:var(--ink-2);fill:none}
svg .s-hair{stroke:var(--hair);fill:none}
svg .s-red{stroke:var(--red);fill:none}
svg .f-ink{fill:var(--ink);stroke:none}
svg .f-2{fill:var(--ink-2);stroke:none;pointer-events:none}
svg .t-let{font:500 12px var(--f-let);fill:var(--ink-2)}
svg .t-dim{font:500 12.5px var(--f-let);fill:var(--ink)}
svg .t-name{font:600 14px var(--f-ko);fill:var(--ink)}
svg .t-red{font:600 12px var(--f-ko);fill:var(--red);letter-spacing:.2em}
svg .lab text{paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round} /* a connector running through a lane's label band stops at the words */
svg .co circle{fill:var(--sheet);stroke:var(--ink);stroke-width:1.3}
svg .co circle+text{font:600 13px var(--f-let);fill:var(--ink)}
/* plants: a rock or a conifer (trunk + crown) in colour with the number knocked out, or a grass tuft in thin ink */
svg .bal :is(path,line),svg.ico :is(path,line){stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
svg :is(.cr,.rk){fill:var(--tree);stroke-width:1}
svg .rk{fill:var(--rock)}
svg .bal path:not(.cr,.rk),svg.ico path:not(.cr,.rk){fill:none}
svg .bal path.hl{stroke:var(--sheet);stroke-width:2.4} /* a trunk or blade standing in front of a rock */
svg.ico *{vector-effect:non-scaling-stroke}
svg .bal text,svg.ico text{font:600 11px var(--f-let);fill:var(--ink)}
svg a:focus-visible :is(circle,path,line){stroke:var(--red);stroke-width:2.2}
svg .kn{fill:var(--sheet)!important}
svg .bal:focus-visible text{fill:var(--red)}
@media (hover:hover){ svg a:hover :is(circle,path,line):not(.hl){stroke:var(--red);stroke-width:2.2} svg .bal:hover text{fill:var(--red)} }
svg a{outline:none}
/* research path motion: the branch walk (once) sprouting the plants, one theme kept, a plant's one-line gist in a note beside it */
svg .walk{opacity:0;pointer-events:none}
svg .bal,svg .bal :is(g,path){transform-box:view-box} /* transform-origin: its ground point, set on each plant */
svg .bal :not(rect){pointer-events:none}
#rl .lane{transition:opacity .2s}
#rl .lane.off{opacity:.25}
#rl .dim>*{transition:transform .25s}
@media (hover:hover){ .blk:has(#rlcap .red:hover) #rl .win :is(path,line){stroke:var(--red);stroke-width:2.2} }
/* the note: a drawing note on the plant's free side, joined to it by a short leader tick */
.rl-box,.det-draw{position:relative}
.nt{position:absolute;left:0;top:0;display:none;width:max-content;max-width:min(23em,100%);padding:3px 8px 5px;background:var(--sheet);border:1px solid var(--ink);font-size:14px;line-height:1.45;pointer-events:none}
.nt.on{display:block;animation:nt .12s}
@keyframes nt{from{opacity:0}}
.nt small{display:block;font:500 13px/1.5 var(--f-let);color:var(--ink-2)}
.nt span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.nt::after{content:"";position:absolute;left:0;top:0;transform:translate(var(--tx),var(--ty));height:8px;border-left:1px solid var(--ink)}
.nt.sd::after{height:0;width:9px;border:0;border-top:1px solid var(--ink)}

/* 03 papers */
/* two rows: topic chips, then filter + count on the left and expand-all on the right */
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 16px;align-items:center;margin-bottom:12px}
.layers{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.ly{display:inline-flex;align-items:center;gap:8px;font:400 14px/1.2 var(--f-ko);padding:6px 10px;border:1px solid var(--hair);background:transparent;color:var(--ink);cursor:pointer;border-radius:0;min-height:32px}
.ly small{font:500 13px var(--f-let);color:var(--ink-2)}
@media (hover:hover){ .ly:hover{border-color:var(--ink)} }
.ly[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.ly[aria-pressed="true"] small,.ly[aria-pressed="true"] .lt{color:var(--sheet)}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--ink);margin:0}
.ctl-r{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.cnt{font:500 14px var(--f-let);font-variant-numeric:tabular-nums}
.cnt b{display:inline-block;min-width:2ch;text-align:right;font-weight:inherit} /* inline-block so the number can roll; two digits reserved, so '/ 24편' never jumps when it does */
#plist{border-top:1px solid var(--ink)}
.row{display:grid;grid-template-columns:32px 60px minmax(0,1fr) 196px;grid-template-areas:"i d m r" "i d x x";gap:0 16px;padding:12px 0;border-bottom:1px solid var(--hair)}
.row.flash{outline:1.5px dashed var(--red);outline-offset:3px}
.r-i{grid-area:i}.r-d{grid-area:d}.r-m{grid-area:m;min-width:0}.r-r{grid-area:r}.rx{grid-area:x}
.r-d{display:flex;flex-direction:column;align-items:flex-start;gap:8px;font:400 14px/1.4 var(--f-let);color:var(--ink-2);padding-top:5px;font-variant-numeric:tabular-nums}
.r-title{font:500 17px/1.35 var(--f-let);text-wrap:pretty;padding-top:2px}
.r-title a{text-decoration:none}
.r-title a:hover{text-decoration:underline}
.ext{font-size:.8em;color:var(--ink-2);margin-left:.2em}
.nw{white-space:nowrap}
.r-gist{font-size:14.5px;line-height:1.55;margin-top:4px}
.r-src{font:400 14px/1.45 var(--f-let);color:var(--ink-2);margin-top:4px}
.r-src b{color:var(--ink);font-weight:600}
.r-src i{font-style:normal;color:var(--ink)}
.idx{font:600 10.5px/1 var(--f-let);letter-spacing:.1em;border:1px solid var(--ink-2);color:var(--ink-2);padding:2px 4px;margin-left:2px;vertical-align:2px}
.more{font:400 14px/1.3 var(--f-ko);background:none;border:0;padding:2px 0;cursor:pointer;color:var(--ink);display:inline-flex;gap:6px;align-items:center;min-height:28px;text-underline-offset:4px}
@media (hover:hover){ .more:hover{color:var(--red);--ul:currentColor} } .more .lbl{text-decoration:underline var(--ul,transparent)} /* not under ▾: it would turn with it. Set through an inherited value: a hover rule on .lbl itself makes WebKit restart the ▾ flip */
.more .ar{font-family:var(--f-let);transition:transform .32s cubic-bezier(.3,1.8,.5,1)} /* flips with a small spring, ~30° past */
.more[aria-expanded="true"] .ar{transform:rotate(180deg)}
.rx{margin-top:12px;padding-left:12px;border-left:1px solid var(--ink);display:grid;gap:8px;max-width:72ch;font-size:14.5px;line-height:1.65}
.rx dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
.rx dt{font-size:14px;color:var(--ink-2)}
.rx .kw{font:400 13.5px var(--f-let);color:var(--ink-2)}
.r-r{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding-top:3px}
/* the tree already marks lead papers; the role is plain text */
.role{font:600 14px/1.3 var(--f-ko);color:var(--ink)}
.tref{display:flex;align-items:center;gap:8px;font-size:14px;line-height:1.35;color:var(--ink-2);text-decoration:none}
.tref .lt{flex:none}
.empty{padding:24px 0;color:var(--ink-2)}

/* 04 work */
.key{display:inline-flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
.key span{display:inline-flex;align-items:center;gap:6px}
.key .bar{position:relative;top:0;display:inline-block;width:28px}
.gt-row{display:grid;grid-template-columns:116px minmax(0,1fr) minmax(240px,34%);grid-template-areas:"w t b";gap:2px 24px;padding:8px 0;border-bottom:1px solid var(--hair);align-items:start}
.gt-ax{padding:0 0 6px;border-bottom:1px solid var(--ink)}
.gt-ax.gt-ax-end{display:none}
.gt-w{grid-area:w;font:400 14px/1.5 var(--f-let);color:var(--ink-2);font-variant-numeric:tabular-nums;padding-top:1px}
.gt-t{grid-area:t;min-width:0}
.gt-b{grid-area:b;min-width:0;padding:4px 10px 0 0} /* right: room for the 'now' arrow and the last year label */
.gt-t h3{font:600 15px/1.5 var(--f-ko)}
.gt-t p{font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.gt-t p b{font-weight:600;color:var(--ink)}
.axis{display:grid;font:500 11.5px var(--f-let);color:var(--ink-2);font-variant-numeric:tabular-nums}
.axis span{border-left:1px solid var(--hair);padding-left:3px;min-height:1.3em;white-space:nowrap}
.track{position:relative;height:16px;background-image:linear-gradient(90deg,var(--hair) 0 1px,transparent 1px);background-repeat:repeat-x}
.bar{position:absolute;top:2px;height:12px;min-width:6px;border:1.3px solid var(--ink);background:var(--sheet)}
.bar.pi{background:repeating-linear-gradient(-45deg,var(--ink) 0 1px,var(--sheet) 1px 4.5px)}
.bar.on::after{content:"";position:absolute;right:-10px;top:50%;transform:translateY(-50%);border-left:8px solid var(--red);border-block:5px solid transparent}
.key .bar.on{margin-right:10px}
#patents{border-top:1px solid var(--ink)}
.pt-row{display:grid;grid-template-columns:116px minmax(0,1fr) 84px 136px;grid-template-areas:"d t s n";gap:2px 24px;padding:8px 0;border-bottom:1px solid var(--hair);align-items:baseline}
.pt-d{grid-area:d;font:400 14px var(--f-let);color:var(--ink-2);font-variant-numeric:tabular-nums}
.pt-t{grid-area:t;font-size:14.5px;line-height:1.55}
.pt-t a{text-decoration:none}
.pt-t a:hover{text-decoration:underline}
.pt-t small{display:block;font-size:14px;line-height:1.5;color:var(--ink-2);margin-top:2px}
.pt-s{grid-area:s}
.pt-n{grid-area:n;font:500 14px var(--f-let);font-variant-numeric:tabular-nums}
.st{display:inline-block;font:600 12.5px/1 var(--f-ko);padding:4px 7px;border:1.3px solid var(--ink);white-space:nowrap}
.st.app{border-style:dashed}
.st.for{border:4px double var(--ink);padding:2px 6px}

/* 05 profile */
.list{border-top:1px solid var(--ink)}
.list li{display:grid;grid-template-columns:116px minmax(0,1fr);gap:2px 24px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:15px;line-height:1.55}
.list li div{text-wrap:pretty}
.list .w{font:400 14px/1.65 var(--f-let);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.list small{display:block;font-size:14px;line-height:1.5;color:var(--ink-2);margin-top:2px}
.list li.now,.list li.now .w,.list li.now small{color:var(--red)}
.tri{display:inline-block;width:12px;height:10px;margin-left:6px;background:var(--red);clip-path:polygon(50% 0,100% 100%,0 100%)}
.list.in small{display:inline-block}
.f-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:40px 48px}

/* 양쪽 정렬: running prose only (never headings, titles, names, dates, rows, labels); the last line stays left.
   Korean breaks only between words (keep-all), so justifying by word spaces alone opened gaps up to 0.9em; the extra room
   is spread over the letters as well (inter-character). Words with Latin letters or digits never break inside (.lw),
   except after a · in a word wider than a phone line (over 28, a Hangul letter counting 2: 소외전원상실(LOOP)·완전교류전원상실(SBO)).
   A paragraph whose worst line would still need more than ~0.1em per letter stays ragged (.rag, set by the script).
   Phones stay ragged: at about 22 letters a line, keep-all leaves too much room to spread calmly.
   Browsers without text-justify (Safari) would stretch the word spaces only: ragged there */
.lw{white-space:nowrap}
@supports (text-justify:inter-character){
  @media (min-width:641px){
    .thesis,.lede p,.det-sum,.cap,.rx>p:first-child,.rx dd{text-align:justify;text-justify:inter-character}
    .rag{text-align:left!important}
  }
}

/* below 940px the figures no longer fit beside the tabs with a clear gap (tabs 271px + figures 480px + 58px gap, measured):
   they become one quiet muted line (two on a phone) right above the tabs, outside the sticky bar, so only the tabs stick.
   The gap to the tabs is kept clearly larger than the gap between the two lines */
@media (max-width:939px){
  .facts{flex-wrap:wrap;gap:2px 16px;width:auto;height:auto;margin:14px 0 2px;padding:0}
  .fact b{font-size:15px;font-weight:400;color:var(--ink-2)}
}
@media (max-width:1000px){
  .gt-row{grid-template-columns:108px minmax(0,1fr) minmax(200px,32%)}
  .row{grid-template-columns:32px 56px minmax(0,1fr) 176px}
}
@media (max-width:860px){
  :root{--pad:24px}
  .dets,.f-grid{grid-template-columns:minmax(0,1fr)}
  .pt-row{grid-template-columns:96px minmax(0,1fr) auto;grid-template-areas:"d t s" "d n s"}
}
@media (max-width:640px){
  :root{--gut:16px;--pad:14px;--tb:46px}
  .frame{margin-top:12px}
  .top{padding-top:12px}
  .pg{padding:16px var(--pad) 24px}
  .blk + .blk{margin-top:24px}
  /* phone: photo stays beside the name, the paragraph and links take the full width */
  .pro{grid-template-columns:minmax(0,1fr) 88px;column-gap:16px}
  .pro img{grid-row:1;width:88px}
  .thesis,.contact{grid-column:1/-1}
  .pro-id{display:block}
  .pro-role{margin-top:6px}
  .pro h1{font-size:26px;flex-direction:column;gap:2px}
  .pro h1 span{font-size:13px;letter-spacing:.2em}
  .pro-role{font-size:15px}
  .role-en{font-size:13.5px}
  .thesis{font-size:15.5px;line-height:1.62}
  /* phone: contact as quiet underlined text, on one line where it fits */
  .contact{gap:0 20px;margin-top:8px}
  .contact .btn{border:0;padding:0;font:400 14px/1.3 var(--f-let);letter-spacing:.02em;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
  .contact .btn.done{background:none;color:var(--red)}
  @media (hover:hover){ .contact .btn:hover{background:none;color:var(--red)} }
  .tabs{gap:0;justify-content:space-between}
  .tabs a{font-size:15.5px}
  .rl-cap{gap:4px 16px}
  .row{grid-template-columns:30px minmax(0,1fr) auto;grid-template-areas:"i d mo" "i m m" "i th th" "i x x";gap:4px 10px;padding:10px 0}
  .r-r{display:contents}
  .row .more{grid-area:mo;align-self:center}
  .row .tref{grid-area:th}
  .r-d{flex-direction:row;align-items:center;gap:10px;padding-top:0;align-self:center}
  .rx{margin-top:4px}
  .r-title{font-size:16.5px}
  .ctl{gap:10px 12px}
  /* phone: date sits beside its bar, title and details get the full width */
  .gt-b{padding-right:14px}
  .gt-row{grid-template-columns:112px minmax(0,1fr);grid-template-areas:"w b" "t t";gap:2px 12px;align-items:center}
  .gt-w{white-space:nowrap}
  .gt-ax .gt-t{display:none}
  .gt-ax .axis span:empty{border-left-color:transparent}
  .gt-ax.gt-ax-end{display:grid;padding:6px 0 0;border-bottom:0;border-top:1px solid var(--ink)}
  .pt-row{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"d n s" "t t t";gap:2px 12px}
  .list li{grid-template-columns:minmax(0,1fr);gap:0}
}
@media (prefers-reduced-motion:reduce){ *,::before{transition:none!important;animation:none!important;scroll-behavior:auto!important} }
</style>
</head>
<body>
<div class="frame">
  <div class="ticks" aria-hidden="true"></div>

  <div class="top">
    <header class="pro" id="pro"></header>
    <div class="facts" id="facts"></div>
  </div>
  <div id="tbmark"></div>
  <div class="tabbar" id="tabbar"><nav class="tabs" id="tabs" aria-label="페이지"></nav></div>

  <div class="panels">
  <section class="pg" data-sheet="research" data-t="연구" aria-labelledby="tab-research" hidden>
    <div class="blk">
      <h2>연구 개요</h2><div class="lede" id="lede"></div>
    </div>
    <div class="blk">
      <div class="h2row"><h2>연구 경로</h2><p id="rlhint">가로축은 발표 연도입니다. 번호를 누르면 그 논문으로 갑니다.</p></div>
      <div class="rl-box" id="rlbox"><svg id="rl" role="group" aria-label="주제별 논문 발표 시점"></svg></div>
      <div class="rl-cap" id="rlcap"></div>
    </div>
    <div class="blk">
      <h2>연구 주제</h2>
      <div class="dets" id="dets"></div>
    </div>
  </section>

  <section class="pg" data-sheet="papers" data-t="논문" aria-labelledby="tab-papers" hidden>
    <p class="cap" id="pcap"></p>
    <div class="ctl">
      <div class="layers" id="layers" role="group" aria-label="주제별 보기"></div>
      <div class="ctl-r">
        <label class="chk" for="leadonly"><input type="checkbox" id="leadonly"> 1저자·교신만</label>
        <span class="cnt" id="cnt" aria-live="polite"></span>
      </div>
      <button class="btn" id="expall" type="button" aria-pressed="false">요약 모두 펼치기</button>
    </div>
    <h2 class="sr">논문 목록</h2>
    <div id="plist"></div>
    <p class="empty" id="empty" hidden>조건에 맞는 논문이 없습니다. 주제를 ‘전체’로 바꾸거나 1저자·교신 조건을 끄세요.</p>
  </section>

  <section class="pg" data-sheet="work" data-t="과제·특허" aria-labelledby="tab-work" hidden>
    <div class="blk">
      <div class="h2row"><h2>연구과제</h2><p class="key"><span><i class="bar pi"></i>과제책임</span><span><i class="bar on"></i>진행 중</span></p></div>
      <div id="gantt"></div>
    </div>
    <div class="blk">
      <h2>특허</h2>
      <div id="patents"></div>
    </div>
  </section>

  <section class="pg" data-sheet="profile" data-t="이력" aria-labelledby="tab-profile" hidden>
    <div class="blk">
      <div class="h2row"><h2>학력·경력</h2><p>붉은 삼각형이 가장 최근 변동입니다.</p></div>
      <ol class="list rv" id="revfull"></ol>
    </div>
    <div class="blk f-grid">
      <div><h2>수상</h2><ul class="list in" id="awards"></ul></div>
      <div><h2>국제·공동 연구</h2><ul class="list" id="collab"></ul></div>
    </div>
  </section>

  <footer class="ft" id="foot"></footer>
  </div>
  <div class="ticks b" aria-hidden="true"></div>
</div>

document.documentElement.lang = 'ko';
const CONTENT = {"name_ko": "김현민", "name_en": "Hyeonmin Kim", "role_ko": "한국원자력연구원 책임연구원 · 원자력공학 박사", "role_en": "Principal Researcher, KAERI · Ph.D. in Nuclear Engineering", "thesis": "원자력발전소의 사고 전개와 기기 상태를 데이터로 예측하고, 그 결과를 확률론적 안전성 평가(PSA)에 반영하는 연구를 합니다. 그중에서도 동적 PSA에 필요한 AI 요소 기술을 개발하고 있으며, 최근에는 AI 에이전트를 활용한 PSA 분석과 자동화에 집중하고 있습니다.", "links": {"scholar": "https://scholar.google.com/citations?user=Ot3XxSkAAAAJ", "researchgate": "https://www.researchgate.net/profile/Hyeonmin-Kim-2"}, "facts": [{"label": "SCI(E) 논문", "value": "23"}, {"label": "1저자·교신", "value": "11"}, {"label": "특허 등록", "value": "5"}, {"label": "특허 출원", "value": "3"}, {"label": "연구과제", "value": "12"}], "lede": ["예측진단(prognostics) 방법을 이용해 원자력발전소의 노화를 반영하는 PSA를 연구했고, 이후 중대사고 진단과 기동 운전 자동화 같은 운전원 지원, 감마선 핵종 식별과 방사선 지도 복원으로 연구 범위를 넓혔습니다. 2019년부터는 동적 PSA를 위한 딥러닝 기술을 개발하고 있습니다. 사건의 순서와 시점까지 따지면 시나리오가 폭발적으로 늘어나는 상태 폭발(state explosion)을 해결하기 위해 열수력 코드 대리모델과 클러스터링을 연구하고, AI 에이전트를 활용해 PSA를 자동화하고 분석하는 연구도 하고 있습니다."], "themes": [{"key": "sur", "name": "대리모델과 동적 PSA", "period": "2019 – 현재", "summary": "열수력 코드 계산을 대신하는 딥러닝 대리모델로 동적 PSA가 다뤄야 하는 대량의 사고 시나리오를 빠르게 평가하고, 분위수 회귀로 예측 구간도 함께 냅니다. 간이 열수력 코드로 SGTR 운전원 대응 조합 약 1,435만 건을 모의해, 그중 14.7%에서 방사성 물질이 환경으로 나갈 수 있는 상황이 생기는 것을 확인했습니다. 소외전원상실(LOOP)·완전교류전원상실(SBO) 시나리오에서는 메타모델이 노심손상 여부를 F1 0.99로 판정해, 시나리오당 2.5~3시간이던 계산을 1 ms 미만으로 줄였습니다.", "keywords": ["Dynamic PSA", "Surrogate model", "Thermal-hydraulic code", "Quantile regression", "Metamodel", "PINN"], "question": "열수력 코드로 일일이 계산하기에는 너무 많은 사고 시나리오를 어떻게 빠르고 믿을 만하게 평가할까?"}, {"key": "diag", "name": "사고 진단과 운전 지원", "period": "2018 – 현재", "summary": "사고 직후의 계측 신호로 사고 종류와 진행 상황을 판단해 운전원에게 알려 주는 모델을 연구합니다. 공동 연구로 OPR1000 중대사고 모의 데이터에 적용한 7개 진단 모듈을 하나로 묶어, 원자로 정지 직후 신호로 초기사건, 파단 크기, golden time, 계측기 건전성을 알려 주는 시스템을 구성했습니다. 교란 분석(perturbation analysis)으로 사고진단 모델에 쓰는 XAI 방법 네 가지를 정량 비교했고, 최근에는 사고를 설명하는 개념 어휘를 조합해 학습 때 보지 못한 다중 사고를 zero-shot으로 진단하는 공동 연구에 참여했습니다.", "keywords": ["Accident diagnosis", "Severe accident", "Operator support system", "Startup automation", "Explainable AI", "Zero-shot learning"], "question": "사고 직후의 신호만으로 무슨 일이 일어났는지 운전원에게 믿을 만하게 알려 줄 수 있을까?"}, {"key": "phm", "name": "기기 예측진단과 PSA", "period": "2014 – 2020", "summary": "기기 예측진단 결과를 PSA 모델과 융합해, 초기사건 빈도와 고장확률을 운전 이력에 따라 갱신하는 방법을 개발했습니다. 기존 증기발생기 전열관 파단(SGTR) 초기사건 빈도에 모의 균열 데이터로 예측한 SGTR 확률을 베이즈 방법으로 결합하자, 균열이 생긴 뒤부터 빈도가 고정된 기존 값에서 벗어나 운전 이력에 따라 달라졌습니다. 여기에 안전주입 펌프의 선형 열화와 정비 후 회복을 가정해 계산한 SGTR 노심손상빈도는 정비 주기에 따라 오르내렸습니다.", "keywords": ["Prognostics", "Condition monitoring", "Remaining useful life", "Particle filter", "Failure rate update"], "question": "기기의 실제 상태를 PSA의 초기사건 빈도와 고장확률에 어떻게 반영할까?"}, {"key": "rad", "name": "방사선 계측과 핵물질 평가", "period": "2020 – 2021", "summary": "측정 시간이 짧거나 일부가 빠진 데이터로도 핵종과 방사선 분포를 정확히 알아내는 방법을 연구했습니다. 감마선 스펙트럼을 에너지 구간별로 나눠 딥러닝 모델에 넣는 전처리로 Co-60·Cs-137 혼합 선원 식별 정확도를 70%에서 100%로 높이고 측정 시간을 60분에서 72초로 줄였습니다. 빈 곳이 생긴 방사선 지도는 U-Net으로 복원해 모의 지도와 실험 지도 모두 지도 전체 상대 오차가 1% 미만이었고, 사용후핵연료에서는 축 방향 위치를 입력에 더해 국부 Pu 밀도 예측의 R²를 0.9776에서 0.9996으로 높였습니다.", "keywords": ["Radionuclide identification", "Gamma-ray spectrum", "Radiation map", "U-Net", "Support vector regression"], "question": "짧게 잰 스펙트럼이나 빈 곳이 있는 센서 데이터로도 방사선 정보를 정확히 얻을 수 있을까?"}], "papers": [{"date": "2026.06", "role": "공동", "theme": "diag", "doi": "10.1016/j.eswa.2026.133392", "title": "Concept-vocabulary compositionality for zero-shot multi-accident diagnosis in nuclear power plants", "journal": "Expert Systems with Applications", "authors": ["Young Ho Chae", "Jeonghun Choi", "Seo Ryong Koo", "Hyeonmin Kim", "Jonghyun Kim"], "id": "p00", "gist": "단일 사고 데이터만으로 학습해 처음 보는 다중 사고 조합을 진단", "summary": "원전에서 여러 사고가 겹치는 경우는 조합이 너무 많아 모두 모의해 학습시키기 어렵습니다. 이 연구는 단일 사고 모의 데이터만으로 계통별 개념 어휘를 벡터 양자화로 학습하고, 관측된 개념 분포를 단일 사고 원형의 합과 비교해 겹친 사고를 zero-shot으로 진단하는 CVC 프레임워크를 제안했습니다. 900 MWe 가압경수로 시뮬레이터(CNS)에서는 LOCA·SGTR·MSLB 중 두 사고가 겹친 시험 500건에서, 서로 다른 시드로 학습한 세 모델을 앙상블해 사고 조합을 97.0% 맞혔습니다.", "method": "벡터 양자화 개념 어휘, 쌍별 차분 점수, zero-shot 조합 진단", "finding": "GPWR 시뮬레이터(사고 4종, 조합 7개)에서는 조건 입력을 더한 CVC가 전체 조합을 zero-shot으로 95.1% 맞혔고, 조건 입력 없이 2중 조합 6개를 구분할 때도 CVC(72%)가 Transformer 인코더(51%)보다 21%p 높았습니다.", "keywords": ["zero-shot learning", "compositionality", "multi-accident diagnosis", "nuclear power plant"], "motif": "classes", "evidence": "full_text"}, {"date": "2026.08", "role": "공동", "theme": "sur", "doi": "10.1088/2632-2153/ae7eef", "title": "Data-driven surrogate modeling for thermal-hydraulic codes via hybrid deep neural networks and quantile learning", "journal": "Machine Learning: Science and Technology", "authors": ["Hyojun Yi", "Hyeonmin Kim", "Seunghyoung Ryu"], "id": "p01", "gist": "급변 구간 예측을 개선한 하이브리드 확률 대리모델", "summary": "동적 PSA에서는 수많은 사고 시나리오를 열수력 코드로 반복 계산해야 해 비용이 큽니다. 이 연구는 BiLSTM, 1D CNN, Transformer를 결합하고 분위수 회귀와 시간 차분 보조 학습(TDS)을 더한 대리모델 QLCT를 제안했습니다. OPR1000 MAAP 시나리오 10,000개에서 비교 모델보다 NMAE를 27.9~49.0% 줄였고, 예측구간 지표도 eQRNN보다 좋았습니다.", "method": "BiLSTM·ConvTR, 분위수 회귀, TDS", "finding": "네 출력 변수 모두에서 MAE가 가장 낮았지만, 늦게 시작되는 급변이 있는 어려운 사례는 평균적인 궤적처럼 평탄하게 예측했습니다.", "keywords": ["surrogate model", "quantile regression", "Transformer", "thermal-hydraulic code", "dynamic PSA"], "motif": "band", "evidence": "full_text"}, {"date": "2026.07", "role": "교신", "theme": "sur", "doi": "10.1016/j.net.2026.104271", "title": "PQNet: Probabilistic Quantile Network for multivariate surrogate modeling in nuclear thermal-hydraulics", "journal": "Nuclear Engineering and Technology", "authors": ["Hyojun Yi", "Jaehyun Cho", "Hyeonmin Kim", "Seunghyoung Ryu"], "id": "p02", "gist": "분위수를 입력으로 받아 여러 변수를 한 모델로 예측", "summary": "열수력 코드는 계산 비용이 커서 PSA의 대규모 시나리오 분석에 쓰기 어렵습니다. PQNet은 MLP-Mixer에 random quantile regression(RQR)을 결합하고 분위수 수준을 입력으로 넣어, 여러 변수와 임의 분위수를 한 모델로 예측합니다. SBO, 소형·중형 LOCA의 MAAP 데이터에서 비교 모델보다 NMAE를 35~58% 줄였습니다.", "method": "MLP-Mixer + RQR, 분위수 입력", "finding": "", "keywords": ["MLP-Mixer", "quantile regression", "surrogate model", "MAAP", "uncertainty"], "motif": "band", "evidence": "full_text"}, {"date": "2026.04", "role": "1저자", "theme": "sur", "doi": "10.1016/j.net.2025.104087", "title": "Metamodel of thermal hydraulic code considering dynamic accident scenarios for dynamic probabilistic safety assessment", "journal": "Nuclear Engineering and Technology", "authors": ["Hyeonmin Kim", "Sang Hoon Han", "Dong-San Kim"], "id": "p03", "gist": "노심손상 여부를 1 ms 안에 판정하는 동적 PSA 메타모델", "summary": "동적 PSA는 사건의 시점까지 다뤄야 해 시나리오가 폭발적으로 늘어납니다. 이 연구는 연속시간 Monte Carlo로 LOOP·SBO 시나리오를 만들어 MAAP5로 계산하고, self-attention을 더한 Inception형 1D CNN 메타모델을 NAS로 설계했습니다. 23개 변수로 노심손상 여부를 F1 0.99로 판정했고, 시나리오당 2.5~3시간이던 계산을 1 ms 미만으로 줄였습니다.", "method": "Inception형 1D CNN, NAS 설계", "finding": "시나리오 10,000개를 평가하는 데 MAAP5는 180개 프로세서로 약 7일이 걸렸지만, 메타모델은 GPU 1개로 약 4분 만에 끝내 2,500배 이상 빨랐습니다.", "keywords": ["dynamic PSA", "metamodel", "Inception network", "neural architecture search", "MAAP5"], "motif": "tree", "evidence": "full_text"}, {"date": "2025.02", "role": "교신", "theme": "diag", "doi": "10.1016/j.pnucene.2025.105605", "title": "Quantitative comparison of explainable artificial intelligence methods for nuclear power plant accident diagnosis models", "journal": "Progress in Nuclear Energy", "authors": ["Seung Geun Kim", "Seunghyoung Ryu", "Kyungho Jin", "Hyeonmin Kim"], "id": "p04", "gist": "교란 분석(perturbation analysis)으로 사고진단용 XAI 방법을 정량 비교", "summary": "원전 분야 DNN 모델은 판단 근거가 드러나지 않아 안전 분야 적용이 어렵고, 원전 분야에서 XAI 방법을 비교한 연구도 적습니다. 이 연구는 교란 분석으로 XAI 방법을 정량 비교하고, 믿을 만한 결과를 얻도록 정보 엔트로피로 교란값을 고르는 방법을 제안했습니다. 간단한 원전 사고진단 모델에 네 가지 XAI 방법을 적용해 이 방식의 효과를 확인했습니다.", "method": "교란 분석, 엔트로피 기반 교란값", "finding": "", "keywords": ["explainable AI", "perturbation analysis", "information entropy", "accident diagnosis"], "motif": "heat", "evidence": "full_text"}, {"date": "2024.11", "role": "공동", "theme": "sur", "doi": "10.1016/j.ress.2024.110406", "title": "A case study to address the limitation of accident scenario identifications with respect to diverse manual responses", "journal": "Reliability Engineering & System Safety", "authors": ["Jinkyun Park", "Hyeonmin Kim"], "id": "p05", "gist": "운전원 대응 조합 1,435만 건 모의로 PSA 시나리오 누락 가능성 확인", "summary": "현재 PSA는 열수력 코드 계산을 줄이려고 소수의 안전 핵심 기기에 집중해 사고 시나리오를 정합니다. 이 연구는 SGTR 비상운전절차의 79개 수동 대응에 누락 여부와 수행 시점을 조합해 14,348,907개 조건을 무작위로 만들고, 간이 열수력 코드인 NPA로 모의했습니다. 그중 약 14.7%에서 방사성 물질이 환경으로 나갈 수 있는 상황이 나타나, 기존 시나리오 목록이 이런 경우를 놓칠 수 있음을 보였습니다.", "method": "SGTR 수동 대응 조합 NPA 모의", "finding": "그 14.7%(약 210만 건)는 주증기 안전밸브(MSSV)가 다섯 번 넘게 여닫혀 열린 채로 고착될 수 있는 경우였습니다.", "keywords": ["probabilistic safety assessment", "SGTR", "manual response", "accident scenario", "emergency operating procedure"], "motif": "tree", "evidence": "full_text"}, {"date": "2023.09", "role": "공동", "theme": "sur", "doi": "10.1016/j.anucene.2023.109840", "title": "Development of a data-driven simulation framework using physics-informed neural network", "journal": "Annals of Nuclear Energy", "authors": ["Young Ho Chae", "Hyeonmin Kim", "Jungjin Bang", "Poong Hyun Seong"], "id": "p06", "gist": "PINN으로 해를 구하고 데이터에서 방정식을 찾는 동적 PSA 시뮬레이션", "summary": "동적 PSA용 시뮬레이션은 계산 속도와 계통 간 상호작용을 함께 반영하기 어렵습니다. 이 연구는 초기·경계 조건으로 해를 구하는 solution generator와 측정 데이터에서 지배방정식을 찾는 model generator를 PINN으로 만들어 A-PRISM이라는 프레임워크로 묶었습니다. 확산 방정식, MARS 배관 유동, CNS 증기발생기 수위, 원자로 축방향 온도의 네 사례로 검증했습니다.", "method": "PINN solution·model generator", "finding": "배관 유동 사례에서 solution generator는 MARS와 거의 같은 결과를 더 짧은 시간에 냈고, CNS 증기발생기 수위 자료에서 model generator는 안전계통 작동으로 수위 추이가 바뀌는 구간마다 수위 방정식을 따로 도출했습니다.", "keywords": ["physics-informed neural network", "dynamic PSA", "data-driven simulation", "MARS"], "motif": "loop", "evidence": "full_text"}, {"date": "2022.08", "role": "공동", "theme": "sur", "doi": "10.1016/j.eswa.2022.116966", "title": "Probabilistic deep learning model as a tool for supporting the fast simulation of a thermal–hydraulic code", "journal": "Expert Systems with Applications", "authors": ["Seunghyoung Ryu", "Hyeonmin Kim", "Seung Geun Kim", "Kyungho Jin", "Jaehyun Cho", "Jinkyun Park"], "id": "p07", "gist": "예측값과 불확실성 범위를 함께 내는 열수력 코드 고속 sses", "evidence": "full_text"}, {"date": "2020.01", "role": "교신", "theme": "rad", "doi": "10.1016/j.anucene.2019.106997", "title": "Influence of the spatial Pu variation for evaluating the Pu content in spent nuclear fuel using Support Vector Regression", "journal": "Annals of Nuclear Energy", "authors": ["Seung Min Woo", "Hyeonmin Kim", "Sunil S. Chirayath"], "id": "p14", "gist": "축 방향 위치를 입력에 더해 SVR의 사용후핵연료 Pu 예측을 개선", "summary": "사용후핵연료의 Pu 생성량을 예측한 기존 연구는 연소도, 냉각 기간, 초기 농축도를 변수로 썼습니다. 이 논문은 여기에 연료의 축 방향 위치를 더한 SVR 모델로 국부 Pu 질량 밀도를 예측하고 SERPENT 계산값과 비교했습니다. 네 변수 모델이 세 변수 모델보다 R²와 RMSE 모두에서 더 정확했고, Pu 밀도와 가장 강하게 상관된 변수는 연소도였습니다.", "method": "SVR 회귀, SERPENT 계산 데이터", "finding": "축 방향 위치를 포함한 네 변수 모델은 R² 0.9996, RMSE 0.0034로 세 변수 모델(R² 0.9776, RMSE 0.0243)보다 정확했습니다.", "keywords": ["spent nuclear fuel", "plutonium", "support vector regression", "axial variation", "SERPENT"], "motif": "grid", "evidence": "full_text"}, {"date": "2019.09", "role": "공동", "theme": "diag", "doi": "10.5302/j.icros.2019.19.0104", "title": "원자력발전소 기동 및 정지 운전을 위한 순환 신경망 기반 인공지능 프레임워크 개발", "journal": "제어로봇시스템학회 논문지", "index": "SCOPUS", "authors": ["Seo Ryong Koo", "Hyeonmin Kim", "Geon Pil Choi", "Jung Taek Kim"], "id": "p15", "gist": "순환 신경망으로 원전 기동 운전을 자동화하는 AI 프레임워크 개발", "summary": "기존 원전의 기동·정지 운전은 감시하고 조작할 변수가 많아 운전원 부담이 크고, 기존 머신러닝으로는 자동화하기 어렵습니다. 이 논문은 시계열 분석에 강한 순환 신경망(RNN)으로 기동 운전 자동화용 AI 프레임워크를 개발했습니다. Westinghouse 3루프 원전을 모사한 CNS 시뮬레이터에서 기동 중 가압기 기포 생성 단계를 대상으로 타당성 연구를 수행했습니다.", "method": "순환 신경망(RNN), CNS 시뮬레이터", "finding": "", "keywords": ["startup operation", "automation", "recurrent neural network", "Compact Nuclear Simulator", "pressurizer"], "motif": "loop", "evidence": "abstract"}, {"date": "2019.01", "role": "1저자", "theme": "phm", "doi": "10.3390/en12010001", "title": "Development of a Physics-Based Monitoring Algorithm Detecting CO₂ Ingress Accidents in a Sodium-Cooled Fast Reactor", "journal": "Energies", "authors": ["Hyeonmin Kim", "Jung-Taek Kim", "Jaehyuk Eoh", "Dong-Won Lim"], "id": "p16", "gist": "동일한 두 열교환기의 압력을 비교해 소듐냉각고속로의 CO₂ 유입 사고를 조기 탐지", "summary": "초임계 CO₂ 사이클을 쓰는 소듐냉각고속로에서는 소듐과 CO₂의 반응이 완만해 CO₂ 유입을 일찍 알아채기 어렵습니다. 동일한 열교환기 두 대의 커버가스 압력을 물리 모델로 비교하고, 허용 오경보율과 목표 탐지 확률로 문턱값과 판정 시간을 정했습니다. 물 모의 실험장치에 공기를 넣은 실험에서 30 cc/s 유입을 67.8초에 잡아내 AAKR-SPRT보다 8초 빨랐습니다.", "method": "물리 기반 압력 잔차 감시·확률 분석", "finding": "오경보율을 0.1%로 묶은 조건에서 공기 30 cc/s(CO₂ 0.12 g/s 상당) 유입을 67.8초 만에 99.99% 탐지 확률로 잡아냈고, 같은 실험 데이터에 적용한 AAKR-SPRT는 75.8초가 걸렸습니다.", "keywords": ["sodium-cooled fast reactor", "S-CO2 Brayton cycle", "CO2 ingress detection", "pressure monitoring", "AAKR-SPRT"], "motif": "band", "evidence": "full_text"}, {"date": "2018.12", "role": "공동", "theme": "phm", "doi": "10.1016/j.net.2018.08.002", "title": "Application of particle filtering for prognostics with measurement uncertainty in nuclear power plants", "journal": "Nuclear Engineering and Technology", "authors": ["Gibeom Kim", "Hyeonmin Kim", "Enrico Zio", "Gyunyoung Heo"], "id": "p17", "gist": "Particle filtering으로 전열관 파손 시점과 측정 불확도 영향을 분석", "summary": "원전 노화관리는 일반 실험 상관식에 기대고 있어 설비마다 다른 이력과 상태를 반영하기 어렵습니다. PASTA로 만든 증기발생기 전열관 파열확률 데이터에 Paris 법칙 기반 particle filtering을 적용해, 일반 상관식을 측정값으로 갱신하며 파손 시점(TTF)을 예측했습니다. 측정 데이터가 쌓일수록 예측 구간이 좁아졌고, 측정 불확도가 작을수록 결과가 측정값 쪽으로 기울었습니다.", "method": "Particle filtering, Paris 법칙", "finding": "측정 데이터를 3 EFPY에서 12 EFPY까지 늘리자 TTF의 5~95 백분위 구간이 11.5~20.8 EFPY에서 16.1~17.8 EFPY로 좁아졌습니다.", "keywords": ["particle filtering", "prognostics", "steam generator tube", "measurement uncertainty", "time to failure"], "motif": "decay", "evidence": "full_text"}, {"date": "2018.07", "role": "1저자", "theme": "phm", "doi": "10.1016/j.ress.2018.03.022", "title": "Failure rate updates using condition-based prognostics in probabilistic safety assessments", "journal": "Reliability Engineering & System Safety", "authors": ["Hyeonmin Kim", "Jung Taek Kim", "Gyunyoung Heo"], "id": "p18", "gist": "예측진단 결과를 PSA와 융합해 SGTR 초기사건 빈도를 운전 이력에 따라 갱신", "summary": "기존 PSA는 노화 영향을 별도 노화관리 프로그램에 맡기거나 일반 데이터로만 반영해, 발전소마다 다른 노화를 담지 못했습니다. 이 연구는 PASTA로 모의한 증기발생기 전열관 균열 데이터에 GPM/Bayes 예측진단을 적용하고, 그 결과를 NUREG/CR-5750의 SGTR 초기사건 빈도(임계 운전 1년당 7.0E-03)와 베이즈 방법으로 결합했습니다. 갱신된 초기사건 빈도는 균열이 생기기 전까지 기존 값과 같다가, 균열이 생긴 뒤부터 운전 이력에 따라 달라졌고 불확실성 범위도 함께 나왔습니다.", "method": "GPM/Bayes 예측진단 + 베이즈 갱신(감마-포아송)", "finding": "정비로 계통이 노화 이전 상태로 돌아가는 효과를 반영해 SGTR 사고 경위의 노심손상빈도(고압·저압 안전주입 계통만 반영)를 계산한 결과, 정비가 없으면 운전할수록 계속 올랐고 주기적인 정비를 반영하면 정비 주기에 맞춰 오르내렸으며, 데이터를 계속 모으면 불확실성 범위가 정비 주기마다 좁아졌습니다.", "keywords": ["probabilistic safety assessment", "condition-based prognostics", "failure rate update", "steam generator tube rupture", "core damage frequency"], "motif": "decay", "evidence": "full_text"}, {"date": "2018.05", "role": "공동", "theme": "diag", "doi": "10.1016/j.net.2018.03.007", "title": "Smart support system for diagnosing severe accidents in nuclear power plants", "journal": "Nuclear Engineering and Technology", "authors": ["Kwae Hwan Yoo", "Ju Hyun Back", "Man Gyun Na", "Seop Hur", "Hyeonmin Kim"], "id": "p19", "gist": "7개 진단 모듈을 묶어 중대사고 상황을 조기에 알려 주는 운전원 지원 시스템", "summary": "중대사고 때는 경보와 정보가 한꺼번에 쏟아져 운전원이 상황을 빨리 파악하기 어렵습니다. MAAP으로 모의한 OPR1000 중대사고 데이터에 SVC, CSVR, CFNN, AAKR-SPRT 등을 적용한 7개 모듈을 하나의 시스템으로 묶었습니다. 원자로 정지 직후의 짧은 신호만으로 초기사건, 파단 크기, 수소 농도, 원자로 수위, golden time, 계측기 건전성을 알려 줍니다.", "method": "SVC, CSVR, CFNN, SVR, AAKR-SPRT", "finding": "고온관 대형 LOCA 시험에서 초기사건, 추정 파단 크기(0.275 m²), 노심 노출 906초·원자로용기 파손 7,653초의 golden time, 격납건물 구획별 환경 위험도를 한 화면에 제시했습니다.", "keywords": ["severe accident diagnosis", "operator support system", "MAAP", "support vector machine", "fuzzy neural network"], "motif": "classes", "evidence": "full_text"}, {"date": "2018.02", "role": "1저자", "theme": "phm", "doi": "10.1016/j.net.2017.10.006", "title": "Prognostics for integrity of steam generator tubes using the general path model", "journal": "Nuclear Engineering and Technology", "authors": ["Hyeonmin Kim", "Jung Taek Kim", "Gyunyoung Heo"], "id": "p20", "gist": "GPM/Bayes로 증기발생기 전열관의 잔여수명 예측을 데이터로 갱신", "summary": "같은 햇수를 운전한 원전이라도 노화 정도가 달라, 일반 실험 상관식만으로는 개별 설비의 신뢰도를 제대로 평가하기 어렵습니다. 데이터 기반 GPM/Bayes 방법으로 PASTA가 만든 증기발생기 전열관 파열확률 경로를 학습하고, 새 감시 데이터가 들어올 때마다 잔여수명(RUL)을 갱신했습니다. 관측 기간이 길어질수록 RUL 예측 오차가 꾸준히 줄었습니다.", "method": "GPM/Bayes (Bayesian 선형회귀)", "finding": "관측 기간을 3 EFPY에서 12 EFPY로 늘리자 전열관 50개 시험 세트의 평균 RUL 오차가 5.15%에서 0.335%로 줄었습니다.", "keywords": ["general path model", "Bayesian linear regression", "prognostics", "steam generator tube", "remaining useful life"], "motif": "decay", "evidence": "full_text"}, {"date": "2017.03", "role": "공동", "theme": "phm", "doi": "10.1016/j.eswa.2016.10.052", "title": "Diagnosis of feedwater heater performance degradation using fuzzy inference system", "journal": "Expert Systems with Applications", "authors": ["Yeon Kwan Kang", "Hyeonmin Kim", "Gyunyoung Heo", "Seok Yoon Song"], "id": "p21", "gist": "전문가 지식을 퍼지 규칙으로 엮어 급수가열기 성능저하를 진단", "summary": "고온·고압 운전과 노화로 생기는 성능저하는 발전소에 경제적 손실을 주므로, 설비 상태를 체계적으로 진단할 방법이 필요합니다. 이 논문은 측정 데이터 종류가 많고 최근 고장 보고가 이어진 급수가열기를 대상으로, 전문가 지식·경험·모의 결과를 퍼지 집합과 규칙으로 엮은 퍼지 추론 시스템을 만들었습니다. 실험에서 불확실성을 고려하며 성능저하를 정량적으로 추론할 수 있음을 확인했습니다.", "method": "퍼지 추론 시스템(FIS)", "finding": "", "keywords": ["fuzzy inference system", "feedwater heater", "performance degradation", "fault diagnosis", "power plant"], "motif": "classes", "evidence": "abstract"}, {"date": "2015.03", "role": "1저자", "theme": "phm", "doi": "10.1016/j.net.2014.12.008", "title": "Reliability data update using condition monitoring and prognostics in probabilistic safety assessment", "journal": "Nuclear Engineering and Technology", "authors": ["Hyeonmin Kim", "Sang-Hwan Lee", "Jun-Seok Park", "Hyungdae Kim", "Yoon-Suk Chang", "Gyunyoung Heo"], "id": "p22", "gist": "상태감시와 prognostics로 PSA 신뢰도 데이터를 시간·상태에 맞게 갱신", "summary": "PSA는 현실적인 위험도를 지향하지만 안전해석 가정과 고장빈도 추정에는 여전히 보수성이 남아 있습니다. 이 논문은 감시·진단·예측(SDP) 기법을 기존 PSA 모델과 결합해 초기사건 빈도와 기본사건 확률을 운전 시간과 상태에 맞게 갱신하는 방법을 제시했습니다. 피동계통 고장확률 평가와 SGTR 초기사건 빈도 갱신, 두 예제로 절차를 보였습니다.", "method": "상태감시·prognostics와 PSA 결합", "fi /* drawer: the address slides out to the right from under the row's left edge, where the button was, with the copy button riding
   its front; the links after it are pushed along to their new places. One pushed onto another line moves with the push as it
   fades, then slips in at its new place once the way is clear, while the row eases to its new height.
   400 ms ease-out, WAAPI, nothing filled: at rest it is the reduced-motion page */
const drawer = (row, em, cp, I, r0, h0) => {
  const o = {duration: 400, easing: 'ease-out'}, x = em.getBoundingClientRect(), c = cp.getBoundingClientRect(), w = x.width, P = c.right - r0[0].right, h1 = row.getBoundingClientRect().height;
  em.animate({transform: [`translateX(${-w}px)`, 'none'], clipPath: [`inset(-4px -4px -4px ${w}px)`, 'inset(-4px)']}, o);
  cp._d = cp.animate({transform: [`translateX(${x.left - c.left}px)`, 'none']}, o);
  I.slice(1).forEach((a, i) => { const r = a.getBoundingClientRect(), dx = r0[i + 1].left - r.left, dy = r0[i + 1].top - r.top;
    a.animate(Math.abs(dy) < 1 ? {transform: [`translateX(${dx}px)`, 'none']} : [{transform: `translate(${dx}px,${dy}px)`, opacity: 1},
      {transform: `translate(${dx + .35 * P}px,${dy}px)`, opacity: 0, offset: .35}, {transform: 'translateX(-12px)', opacity: 0, offset: .8}, {transform: 'none', opacity: 1}], o); });
  Math.abs(h1 - h0) < .5 || row.animate({height: [h0 + 'px', h1 + 'px']}, o);
};

let mail = '';
const wire = k => { $('#reveal' + k).addEventListener('click', e => {
